<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head_fragment(scripts = ~{::script}, links = ~{::link})}">
</head>
<body>
  <div class="container">
    <form th:object="${qanda}">
      <div class="fixed-top bg-white">
        <div class="text-center bg-white">
          <h1>設定: 登録画面</h1>
          <br>
          <div class="text-end">
            <a th:href="@{/qanda/list}" class="col-2 btn btn-secondary">一覧に戻る</a>
            <input type="submit" th:formaction="@{/qanda/create}" th:formmethod="post" class="col-2 btn btn-primary" value="登録する">
          </div>
        </div>
      </div>
      <br>
      <br>
      <div class="form-group mt-2">
        <label class="form-label" for="inputId">ID:</label>
        <input type="text" class="form-control" id="inputId" th:field="*{id}" disabled>
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputQuestion">質問:&nbsp;<span class="badge bg-danger">必須</span></label>
        <input type="text" class="form-control" id="inputQuestion" th:field="*{question}" placeholder="質問を入力してください">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputAnswer">回答:</label>
        <input type="text" class="form-control" id="inputAnswer" th:field="*{answer}" placeholder="回答を入力してください">
      </div>
    </form>
  </div>
</body>
</html>
