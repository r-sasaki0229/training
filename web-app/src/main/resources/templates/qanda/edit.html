<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head_fragment(scripts = ~{::script}, links = ~{::link})}">
</head>
<body>
  <div class="container">
    <form th:object="${qanda}">
      <div class="fixed-top bg-white">
        <div class="text-center bg-white">
          <h1>設定: 変更画面</h1>
          <label th:if="${message != ''}" class="text-danger" th:text="${message}"></label>
          <br>
          <div class="text-end">
            <a th:href="@{/qanda/list}" class="col-2 btn btn-secondary">一覧に戻る</a>
            <a th:href="@{/qanda/{id}(id=*{id})}" class="col-2 btn btn-secondary">詳細に戻る</a>
            <input type="submit" th:formaction="@{/qanda/update}" th:formmethod="post" class="col-2 btn btn-primary" value="更新する">
          </div>
        </div>
      </div>
      <br>
      <br>
      <br>
      <div class="row">
        <label class="col-2 border bg-light col-form-label">ID:</label>
        <div class="col border">
          <label class="col-form-label" th:text="*{id}"></label>
          <input type="hidden" th:field="*{id}">
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputQanda">
          質問:&nbsp;<span class="badge bg-danger">必須</span>
        </label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputQuestion" th:field="*{question}" placeholder="質問を入力してください">
          <div class="invalid-feedback" th:errors="*{question}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputAnswer">回答:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputAnswer" th:field="*{answer}" placeholder="回答を入力してください">
          <div class="invalid-feedback" th:errors="*{answer}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label ">更新日時:</label>
        <div class="col border">
          <label class="col-form-label" th:text="*{#temporals.format(updateDate, 'yyyy/MM/dd HH:mm:ss')}"></label>
          <input type="hidden" th:field="*{updateDate}">
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label ">登録日時:</label>
        <div class="col border">
          <label class="col-form-label" th:text="*{#temporals.format(createDate, 'yyyy/MM/dd HH:mm:ss')}"></label>
          <input type="hidden" th:field="*{createDate}">
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label ">削除日時:</label>
        <div class="col border">
          <label class="col-form-label" th:text="*{#temporals.format(deleteDate, 'yyyy/MM/dd HH:mm:ss')}"></label>
          <input type="hidden" th:field="*{deleteDate}">
        </div>
      </div>
    </form>
  </div>
</body>
</html>
