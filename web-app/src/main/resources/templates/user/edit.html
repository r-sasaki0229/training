<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head_fragment(scripts = ~{::script}, links = ~{::link})}">
</head>
<body>
  <div class="container">
    <form th:object="${user}">
      <div class="fixed-top bg-white">
        <div class="text-center bg-white">
          <h1>顧客情報: 変更画面</h1>
          <label th:if="${message != ''}" class="text-danger" th:text="${message}"></label>
          <br>
          <div class="text-end">
            <a th:href="@{/user/list}" class="col-2 btn btn-secondary">一覧に戻る</a>
            <a th:href="@{/user/{id}(id=*{id})}" class="col-2 btn btn-secondary">詳細に戻る</a>
            <input type="submit" th:formaction="@{/user/update}" th:formmethod="post" class="col-2 btn btn-primary" value="更新する">
          </div>
        </div>
      </div>
      <br>
      <br>
      <br>
      <div class="row">
        <label class="col-2 border bg-light col-form-label">ID:</label>
        <div class="col border">
          <label class="col-form-label" th:text="*{id}"></label>
          <input type="hidden" th:field="*{id}">
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputcompanyname">会社名:&nbsp;<span class="badge bg-danger">必須</span></label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputcompanyname" th:field="*{companyname}" placeholder="サンプル株式会社">
          <div class="invalid-feedback" th:errors="*{companyname}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputceoname">代表取締役氏名:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputceoname" th:field="*{ceoname}" placeholder="サンプル太郎">
          <div class="invalid-feedback" th:errors="*{ceoname}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputphone">電話番号:&nbsp;<span class="badge bg-danger">必須</span></label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputphone" th:field="*{phone}" placeholder="0120-1234-1234">
          <div class="invalid-feedback" th:errors="*{phone}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputaddressnumber">郵便番号:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputaddressnumber" th:field="*{addressnumber}" placeholder="123-4567">
          <div class="invalid-feedback" th:errors="*{addressnumber}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputaddress">住所:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputaddress" th:field="*{address}" placeholder="東京都新宿区1-2-3歌舞伎町ビル10F">
          <div class="invalid-feedback" th:errors="*{address}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputdepmentname">担当者部署:&nbsp;<span class="badge bg-danger">必須</span></label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputdepmentname" th:field="*{depmentname}" placeholder="サンプル部署">
          <div class="invalid-feedback" th:errors="*{depmentname}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputmanegername">担当者氏名:&nbsp;<span class="badge bg-danger">必須</span></label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputmanegername" th:field="*{manegername}" placeholder="サンプル次郎">
          <div class="invalid-feedback" th:errors="*{manegername}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputscale">会社規模:</label>
        <div class="col border p-2">
          <select class="config-select" th:field="*{scale}">
            <option th:each="config : ${config}" th:value="${config.id}" th:text="${config.name}" th:selected="${config.id == 1}"></option>
          </select>
          <div class="invalid-feedback" th:errors="*{scale}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputproduct">導入製品:&nbsp;<span class="badge bg-danger">必須</span></label>
        <div class="col border p-2">
          <select class="config2-select" th:field="*{product}">
            <option th:each="config2 : ${config2}" th:value="${config2.id}" th:text="${config2.name}" th:selected="${config2.id == 1}"></option>
          </select>
          <div class="invalid-feedback" th:errors="*{product}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputstatus">ステータス:&nbsp;<span class="badge bg-danger">必須</span></label>
        <div class="col border p-2">
          <select class="config3-select" th:field="*{status}">
            <option th:each="config3 : ${config3}" th:value="${config3.id}" th:text="${config3.name}" th:selected="${config3.id == 1}"></option>
          </select>
          <div class="invalid-feedback" th:errors="*{status}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputcontrastartymd">契約開始日:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputcontrastartymd" th:field="*{contrastartymd}" placeholder="2020/10/01">
          <div class="invalid-feedback" th:errors="*{contrastartymd}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputintrostartymd">稼働開始日:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputintrostartymd" th:field="*{introstartymd}" placeholder="2021/04/01">
          <div class="invalid-feedback" th:errors="*{introstartymd}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputmaintestartymd">保守開始日:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputmaintestartymd" th:field="*{maintestartymd}" placeholder="2021/04/01">
          <div class="invalid-feedback" th:errors="*{maintestartymd}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputcontraendymd">契約終了日:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputcontraendymd" th:field="*{contraendymd}" placeholder="2040/03/31">
          <div class="invalid-feedback" th:errors="*{contraendymd}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputdocpass">資料置場:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputdocpass" th:field="*{docpass}" placeholder="\\sang.co.jp\sangfs\顧客別資料">
          <div class="invalid-feedback" th:errors="*{docpass}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputintroname">導入メンバー:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputintroname" th:field="*{introname}" placeholder="サンプルA、サンプルB、サンプルC">
          <div class="invalid-feedback" th:errors="*{introname}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputintrocontactmail">導入メンバーメールアドレス:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputintrocontactmail" th:field="*{introcontactmail}" placeholder="sampleA@address.com、sampleB@address.com、sampleC@address.com">
          <div class="invalid-feedback" th:errors="*{introcontactmail}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputintrocontactphone">導入メンバー電話番号:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputintrocontactphone" th:field="*{introcontactphone}" placeholder="080-1234-5678、080-2345-6789、080-3456-7890">
          <div class="invalid-feedback" th:errors="*{introcontactphone}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputmaintename">保守メンバー:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputmaintename" th:field="*{maintename}" placeholder="サンプルD、サンプルE、サンプルF">
          <div class="invalid-feedback" th:errors="*{maintename}"></div>
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label d-flex align-items-center" for="inputremark">備考:</label>
        <div class="col border p-2">
          <input type="text" class="form-control" th:errorclass="is-invalid" id="inputremark" th:field="*{remark}" placeholder="特筆すべき情報を記載">
          <div class="invalid-feedback" th:errors="*{remark}"></div>
        </div>
      </div>

      <!--  -->

      <div class="row">
        <label class="col-2 border bg-light col-form-label ">更新日時:</label>
        <div class="col border">
          <label class="col-form-label" th:text="*{#temporals.format(updateDate, 'yyyy/MM/dd HH:mm:ss')}"></label>
          <input type="hidden" th:field="*{updateDate}">
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label ">登録日時:</label>
        <div class="col border">
          <label class="col-form-label" th:text="*{#temporals.format(createDate, 'yyyy/MM/dd HH:mm:ss')}"></label>
          <input type="hidden" th:field="*{createDate}">
        </div>
      </div>
      <div class="row">
        <label class="col-2 border bg-light col-form-label ">削除日時:</label>
        <div class="col border">
          <label class="col-form-label" th:text="*{#temporals.format(deleteDate, 'yyyy/MM/dd HH:mm:ss')}"></label>
          <input type="hidden" th:field="*{deleteDate}">
        </div>
      </div>
    </form>
  </div>

</body>
</html>
