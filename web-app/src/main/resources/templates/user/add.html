<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head_fragment(scripts = ~{::script}, links = ~{::link})}">
</head>
<body>
  <div class="container">
    <form th:object="${user}">
      <div class="fixed-top bg-white">
        <div class="text-center bg-white">
          <h1>顧客情報: 登録画面</h1>
          <br>
          <div class="text-end">
            <a th:href="@{/user/list}" class="col-2 btn btn-secondary">一覧に戻る</a>
            <input type="submit" th:formaction="@{/user/create}" th:formmethod="post" class="col-2 btn btn-primary" value="登録する">
          </div>
        </div>
      </div>
      <br>
      <br>
      <div class="form-group mt-2">
        <label class="form-label" for="inputId">ID:</label>
        <input type="text" class="form-control" id="inputId" th:field="*{id}" disabled>
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputcompanyname">会社名:&nbsp;<span class="badge bg-danger">必須</span></label>
        <input type="text" class="form-control" id="inputcompanyname" th:field="*{companyname}" placeholder="サンプル株式会社">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputceoname">代表取締役氏名:</label>
        <input type="text" class="form-control" id="inputceoname" th:field="*{ceoname}" placeholder="サンプル太郎">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputphone">電話番号:&nbsp;<span class="badge bg-danger">必須</span></label>
        <input type="text" class="form-control" id="inputphone" th:field="*{phone}" placeholder="0120-1234-1234">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputaddressnumber">郵便番号:</label>
        <input type="text" class="form-control" id="inputaddressnumber" th:field="*{addressnumber}" placeholder="123-4567">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputaddress">住所:</label>
        <input type="text" class="form-control" id="inputaddress" th:field="*{address}" placeholder="東京都新宿区1-2-3歌舞伎町ビル10F">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputdepmentname">担当者部署:&nbsp;<span class="badge bg-danger">必須</span></label>
        <input type="text" class="form-control" id="inputdepmentname" th:field="*{depmentname}" placeholder="サンプル部署">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputmanegername">担当者氏名:&nbsp;<span class="badge bg-danger">必須</span></label>
        <input type="text" class="form-control" id="inputmanegername" th:field="*{manegername}" placeholder="サンプル次郎">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputscale">会社規模:</label>
        <select class="config-select" id="inputscale" th:field="*{scale}">
          <option th:each="config : ${config}" th:value="${config.id}" th:text="${config.name}"></option>
        </select>
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputproduct">導入製品:&nbsp;<span class="badge bg-danger">必須</span></label>
        <select class="config2-select" id="inputproduct" th:field="*{product}">
          <option th:each="config2 : ${config2}" th:value="${config2.id}" th:text="${config2.name}"></option>
        </select>
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputstatus">ステータス:&nbsp;<span class="badge bg-danger">必須</span></label>
        <select class="config3-select" id="inputstatus" th:field="*{status}">
          <option th:each="config3 : ${config3}" th:value="${config3.id}" th:text="${config3.name}"></option>
        </select>
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputcontrastartymd">契約開始日:</label>
        <input type="text" class="form-control" id="inputcontrastartymd" th:field="*{contrastartymd}" placeholder="2020/10/01">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputintrostartymd">稼働開始日:</label>
        <input type="text" class="form-control" id="inputintrostartymd" th:field="*{introstartymd}" placeholder="2021/04/01">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputmaintestartymd">保守開始日:</label>
        <input type="text" class="form-control" id="inputmaintestartymd" th:field="*{maintestartymd}" placeholder="2021/04/01">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputcontraendymd">契約終了日:</label>
        <input type="text" class="form-control" id="inputcontraendymd" th:field="*{contraendymd}" placeholder="2040/03/31">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputdocpass">資料置場:</label>
        <input type="text" class="form-control" id="inputdocpass" th:field="*{docpass}" placeholder="\\sang.co.jp\sangfs\顧客別資料">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputintroname">導入メンバー:</label>
        <input type="text" class="form-control" id="inputintroname" th:field="*{introname}" placeholder="サンプルA、サンプルB、サンプルC">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputintrocontactmail">導入メンバーメールアドレス:</label>
        <input type="text" class="form-control" id="inputintrocontactmail" th:field="*{introcontactmail}" placeholder="sampleA@address.com、sampleB@address.com、sampleC@address.com">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputintrocontactphone">導入メンバー電話番号:</label>
        <input type="text" class="form-control" id="inputintrocontactphone" th:field="*{introcontactphone}" placeholder="080-1234-5678、080-2345-6789、080-3456-7890">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputmaintename">保守メンバー:</label>
        <input type="text" class="form-control" id="inputmaintename" th:field="*{maintename}" placeholder="サンプルD、サンプルE、サンプルF">
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputremark">備考:</label>
        <input type="text" class="form-control" id="inputremark" th:field="*{remark}" placeholder="特筆すべき情報を記載">
      </div>
    </form>
  </div>
</body>
</html>
