<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head_fragment(scripts = ~{::script}, links = ~{::link})}">
</head>
<body>
  <div class="container">
    <form th:object="${config}">
      <div class="fixed-top bg-white">
        <div class="text-center bg-white">
          <h1>会社規模: 登録画面</h1>
          <br>
          <div class="text-end">
            <a th:href="@{/config/list}" class="col-2 btn btn-secondary">一覧に戻る</a>
            <input type="submit" th:formaction="@{/config/create}" th:formmethod="post" class="col-2 btn btn-primary" value="登録する">
          </div>
        </div>
      </div>
      <br>
      <br>
      <div class="form-group mt-2">
        <label class="form-label" for="inputId">ID:</label>
        <input type="text" class="form-control" id="inputId" th:field="*{id}" disabled>
      </div>
      <div class="form-group mt-2">
        <label class="form-label" for="inputName">名称:&nbsp;<span class="badge bg-danger">必須</span></label>
        <input type="text" class="form-control" id="inputName" th:field="*{name}" placeholder="サンプル設定">
      </div>
    </form>
  </div>
</body>
</html>
